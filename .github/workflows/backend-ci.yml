name: Backend CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  MYPY_VERSION: '1.19.1'
  BLACK_VERSION: '26.1.0'
  ISORT_VERSION: '8.0.1'

jobs:
  lint-black:
    name: Lint | Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run Black
        working-directory: backend
        run: uvx black@${{ env.BLACK_VERSION }} --check --diff .

  lint-isort:
    name: Lint | isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run isort
        working-directory: backend
        run: uvx isort@${{ env.ISORT_VERSION }} --check-only --diff --profile black .

  lint-mypy:
    name: Lint | Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # the lockfile gives mypy the real dependency set, then the pin above wins
      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --frozen
          uv pip install mypy==${{ env.MYPY_VERSION }}

      - name: Run Mypy
        working-directory: backend
        run: uv run --no-sync mypy . --ignore-missing-imports

  lint:
    name: Lint Stage
    runs-on: ubuntu-latest
    needs:
      - lint-black
      - lint-isort
      - lint-mypy
    steps:
      - name: Lint stage passed
        run: echo "All lint checks passed."

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONPATH: ..
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Unit Tests (dev branch)
        if: github.base_ref == 'dev'
        working-directory: backend
        run: uv run --frozen pytest -m unit -vv

      - name: Run Release Tests (main branch)
        if: github.base_ref == 'main'
        working-directory: backend
        run: uv run --frozen pytest -vv