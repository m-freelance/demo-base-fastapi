# pyproject.toml
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-base-fastapi"
version = "1.0.0"
description = "Demo FastAPI application"
requires-python = ">=3.14"
dependencies = [
  # Web framework
  "fastapi>=0.135.1",
  "uvicorn>=0.42.0",
  # Database
  "sqlalchemy>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.48",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  # Data validation
  "pydantic[email]>=2.0.0",
  "types-PyYAML>=6.0.0",
  # Configuration
  "pyyaml>=6.0",
  # Authentication
  "pyjwt>=2.8.0",
  "passlib[argon2]>=1.7.4",
  "python-multipart>=0.0.6",
  # Pagination
  "fastapi-pagination>=0.12.0",
]

[dependency-groups]
dev = [
  # Testing (aiosqlite backs the in-memory SQLite tests)
  "pytest>=7.4.0",
  "pytest-env>=1.0.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.28.1",
  "aiosqlite>=0.19.0",
  # Code formatting and linting
  "black>=26.1.0",
  "isort>=8.0.1",
  "mypy>=1.19.1",
]

# The app runs off PYTHONPATH, it is never installed as a distribution,
# so uv only resolves and installs the dependencies listed above.
[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --maxfail=1"

python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
  "unit: fast unit tests",
  "integration: integration tests",
  "release: release tests",
]

log_cli = true
log_cli_level = "INFO"

filterwarnings = [
  "error::DeprecationWarning:your_package.*",
  "ignore::DeprecationWarning",
]

norecursedirs = [".git", ".venv", "dist", "build"]

[tool.pytest_env]
DEPLOYMENT_TYPE = "test"

[tool.isort]
profile = "black"
